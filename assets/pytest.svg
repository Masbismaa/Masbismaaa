<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <style>
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ember { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-160px); opacity: 0; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    .sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3.4s ease-in-out infinite; }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    .rise { animation: rise .9s cubic-bezier(.22,1,.36,1) var(--s, 0s) both; }
    .ember { animation: ember var(--d, 5s) linear var(--s, 0s) infinite; }
    @keyframes t0 { 0%, 8% { fill: #3B1512; } 11%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes x0 { 0%, 8% { fill: #A99C86; } 11%, 92% { fill: #F3E6CC; } 100% { fill: #A99C86; } }
    .t0 { animation: t0 11s ease-out infinite; } .x0 { animation: x0 11s ease-out infinite; }
    @keyframes t1 { 0%, 15% { fill: #3B1512; } 18%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes x1 { 0%, 15% { fill: #A99C86; } 18%, 92% { fill: #F3E6CC; } 100% { fill: #A99C86; } }
    .t1 { animation: t1 11s ease-out infinite; } .x1 { animation: x1 11s ease-out infinite; }
    @keyframes t2 { 0%, 22% { fill: #3B1512; } 25%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes x2 { 0%, 22% { fill: #A99C86; } 25%, 92% { fill: #F3E6CC; } 100% { fill: #A99C86; } }
    .t2 { animation: t2 11s ease-out infinite; } .x2 { animation: x2 11s ease-out infinite; }
    @keyframes t3 { 0%, 29% { fill: #3B1512; } 32%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes x3 { 0%, 29% { fill: #A99C86; } 32%, 92% { fill: #F3E6CC; } 100% { fill: #A99C86; } }
    .t3 { animation: t3 11s ease-out infinite; } .x3 { animation: x3 11s ease-out infinite; }
    @keyframes t4 { 0%, 36% { fill: #3B1512; } 39%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes x4 { 0%, 36% { fill: #A99C86; } 39%, 92% { fill: #F3E6CC; } 100% { fill: #A99C86; } }
    .t4 { animation: t4 11s ease-out infinite; } .x4 { animation: x4 11s ease-out infinite; }
    @keyframes t5 { 0%, 43% { fill: #3B1512; } 46%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes x5 { 0%, 43% { fill: #A99C86; } 46%, 92% { fill: #F3E6CC; } 100% { fill: #A99C86; } }
    .t5 { animation: t5 11s ease-out infinite; } .x5 { animation: x5 11s ease-out infinite; }
    @keyframes t6 { 0%, 50% { fill: #3B1512; } 53%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes x6 { 0%, 50% { fill: #A99C86; } 53%, 92% { fill: #F3E6CC; } 100% { fill: #A99C86; } }
    .t6 { animation: t6 11s ease-out infinite; } .x6 { animation: x6 11s ease-out infinite; }
    @keyframes stamp { 0%, 60% { transform: scale(0) rotate(-14deg); opacity: 0; } 64% { transform: scale(1.15) rotate(-8deg); opacity: 1; } 68%, 92% { transform: scale(1) rotate(-8deg); opacity: 1; } 100% { opacity: 0; } }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stamp 11s ease-out infinite; }
  </style>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <style>
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ember { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-160px); opacity: 0; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    .sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3.4s ease-in-out infinite; }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    .rise { animation: rise .9s cubic-bezier(.22,1,.36,1) var(--s, 0s) both; }
    .ember { animation: ember var(--d, 5s) linear var(--s, 0s) infinite; }
    @keyframes l0 { 0%, 10% { fill: #3B1512; } 14%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes g0 { 0%, 10% { opacity: 0; } 14%, 92% { opacity: 1; } 100% { opacity: 0; } }
    .l0 { animation: l0 7s ease-out infinite; } .g0 { animation: g0 7s ease-out infinite; }
    @keyframes l1 { 0%, 24% { fill: #3B1512; } 28%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes g1 { 0%, 24% { opacity: 0; } 28%, 92% { opacity: 1; } 100% { opacity: 0; } }
    .l1 { animation: l1 7s ease-out infinite; } .g1 { animation: g1 7s ease-out infinite; }
    @keyframes l2 { 0%, 38% { fill: #3B1512; } 42%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes g2 { 0%, 38% { opacity: 0; } 42%, 92% { opacity: 1; } 100% { opacity: 0; } }
    .l2 { animation: l2 7s ease-out infinite; } .g2 { animation: g2 7s ease-out infinite; }
    @keyframes l3 { 0%, 52% { fill: #3B1512; } 56%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes g3 { 0%, 52% { opacity: 0; } 56%, 92% { opacity: 1; } 100% { opacity: 0; } }
    .l3 { animation: l3 7s ease-out infinite; } .g3 { animation: g3 7s ease-out infinite; }
    @keyframes l4 { 0%, 66% { fill: #3B1512; } 70%, 92% { fill: #E0482F; } 100% { fill: #3B1512; } }
    @keyframes g4 { 0%, 66% { opacity: 0; } 70%, 92% { opacity: 1; } 100% { opacity: 0; } }
    .l4 { animation: l4 7s ease-out infinite; } .g4 { animation: g4 7s ease-out infinite; }
  </style>

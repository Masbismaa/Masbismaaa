<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <style>
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ember { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-160px); opacity: 0; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    .sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3.4s ease-in-out infinite; }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    .rise { animation: rise .9s cubic-bezier(.22,1,.36,1) var(--s, 0s) both; }
    .ember { animation: ember var(--d, 5s) linear var(--s, 0s) infinite; }
    @keyframes zoom { from { transform: scale(1); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
    .frame { transform-origin: 640px 150px; animation: zoom 6s linear infinite; }
    @keyframes role { 0%, 2% { opacity: 0; transform: translateY(8px); } 6%, 30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; } }
    .role { opacity: 0; animation: role 9s ease-in-out 1.4s infinite; } .r2 { animation-delay: 4.4s; } .r3 { animation-delay: 7.4s; }

    @keyframes gleamH { 0%, 55% { transform: translateX(-120px); } 90%, 100% { transform: translateX(600px); } }
    .gl { animation: gleamH 3.6s ease-in-out infinite; }
    @keyframes cut { 0%, 70% { stroke-dashoffset: 1000; opacity: 1; } 76% { stroke-dashoffset: 0; opacity: 1; } 90%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    .cut { stroke-dasharray: 1000; animation: cut 5s ease-out infinite; }
    @keyframes jolt { 0%, 74% { transform: none; } 76% { transform: translate(-4px, 3px); } 79% { transform: translate(3px, -2px); } 82%, 100% { transform: none; } }
    .jolt { animation: jolt 5s ease-out infinite; }
  </style>
